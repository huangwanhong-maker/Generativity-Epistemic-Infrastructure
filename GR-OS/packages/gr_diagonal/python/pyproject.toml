[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"
[project]
name = "gr-diagonal"
version = "0.1.0"
description = "Independent exact diagonal extension for the installed GR-OS SDK"
requires-python = ">=3.10"
[tool.setuptools.packages.find]
where = ["src"]
