[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "gr-os"
version = "0.6.0"
description = "Python SDK for the separately installed GR-OS semantic and physical libraries"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "GR Infrastructure contributors"}]
classifiers = ["Programming Language :: Python :: 3", "Development Status :: 3 - Alpha"]

[tool.setuptools.packages.find]
where = ["src"]
